<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07141c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b1f2a" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#3ee0c4" flood-opacity="0.35"/>
    </filter>
    <style>
      .box { fill: url(#panel); stroke: #3ee0c4; stroke-width: 1.8; }
      .label { font-family: "JetBrains Mono", "IBM Plex Mono", "Fira Code", monospace; font-size: 24px; font-weight: 500; fill: #e8fffa; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0.6px; }
      .cap { font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; fill: #9be8d8; text-anchor: middle; letter-spacing: 0.8px; }
      .rail { stroke: #3ee0c4; stroke-width: 2.2; fill: none; opacity: 0.9; }
      .arrow { stroke: #7cf0dd; stroke-width: 2.4; fill: none; marker-end: url(#ahC); }
    </style>
    <marker id="ahC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7cf0dd"/>
    </marker>
  </defs>

  <g filter="url(#glow)">
    <rect class="box" x="40" y="110" width="260" height="140" rx="18"/>
    <rect class="box" x="360" y="110" width="260" height="140" rx="18"/>
    <rect class="box" x="980" y="110" width="260" height="140" rx="18"/>
    <rect class="box" x="1300" y="110" width="260" height="140" rx="18"/>
  </g>

  <text class="label" x="170" y="182">hard drive</text>
  <text class="label" x="490" y="182">ahk</text>
  <text class="label" x="1110" y="182">js</text>
  <text class="label" x="1430" y="182">browser</text>

  <line class="rail" x1="300" y1="168" x2="360" y2="168"/>
  <line class="rail" x1="300" y1="192" x2="360" y2="192"/>
  <line class="rail" x1="1240" y1="168" x2="1300" y2="168"/>
  <line class="rail" x1="1240" y1="192" x2="1300" y2="192"/>

  <line class="arrow" x1="640" y1="148" x2="960" y2="148"/>
  <line class="arrow" x1="960" y1="212" x2="640" y2="212"/>

  <text class="cap" x="800" y="78">new html content</text>
  <text class="cap" x="800" y="270">node server</text>
</svg>
