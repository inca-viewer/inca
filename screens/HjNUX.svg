<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#eef2f7" stop-opacity="0.86"/>
    </linearGradient>
    <filter id="card" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .box { fill: url(#glass); stroke: #c9d3e0; stroke-width: 1.6; }
      .label { font-family: Inter, "IBM Plex Sans", sans-serif; font-size: 40px; font-weight: 650; fill: #1b2430; text-anchor: middle; dominant-baseline: middle; }
      .cap { font-family: Inter, "IBM Plex Sans", sans-serif; font-size: 26px; font-weight: 650; fill: #3a4656; text-anchor: middle; }
      .rail { stroke: #8ea0b5; stroke-width: 2.6; fill: none; }
      .arrowA { stroke: #2f6fed; stroke-width: 3.2; fill: none; marker-end: url(#ahB); }
      .arrowB { stroke: #0f9d7a; stroke-width: 3.2; fill: none; marker-end: url(#ahG); }
    </style>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f9d7a"/>
    </marker>
  </defs>
  <g filter="url(#card)">
    <rect class="box" x="28" y="118" width="280" height="154" rx="32"/>
    <rect class="box" x="356" y="118" width="280" height="154" rx="32"/>
    <rect class="box" x="964" y="118" width="280" height="154" rx="32"/>
    <rect class="box" x="1292" y="118" width="280" height="154" rx="32"/>
  </g>
  <text class="label" x="168" y="198">hard drive</text>
  <text class="label" x="496" y="198">ahk</text>
  <text class="label" x="1104" y="198">js</text>
  <text class="label" x="1432" y="198">browser</text>
  <line class="rail" x1="308" y1="178" x2="356" y2="178"/>
  <line class="rail" x1="308" y1="212" x2="356" y2="212"/>
  <line class="rail" x1="1244" y1="178" x2="1292" y2="178"/>
  <line class="rail" x1="1244" y1="212" x2="1292" y2="212"/>
  <line class="arrowA" x1="656" y1="158" x2="944" y2="158"/>
  <line class="arrowB" x1="944" y1="232" x2="656" y2="232"/>
  <text class="cap" x="800" y="78">new html content</text>
