<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07141c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0b1f2a" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#3ee0c4" flood-opacity="0.35"/>
    </filter>
    <style>
      .box { fill: url(#panel); stroke: #3ee0c4; stroke-width: 2; }
      .label { font-family: "JetBrains Mono", "IBM Plex Mono", "Fira Code", monospace; font-size: 36px; font-weight: 600; fill: #e8fffa; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0.4px; }
      .cap { font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-size: 24px; font-weight: 600; fill: #9be8d8; text-anchor: middle; letter-spacing: 0.6px; }
      .rail { stroke: #3ee0c4; stroke-width: 2.6; fill: none; opacity: 0.9; }
      .arrow { stroke: #7cf0dd; stroke-width: 3; fill: none; marker-end: url(#ahC); }
    </style>
    <marker id="ahC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7cf0dd"/>
